services:
  produtos:
    build: ./produtos
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/produtos_db
    depends_on:
      postgres:
        condition: service_healthy

  pedidos:
    build: ./pedidos
    ports:
      - "3002:3002"
    environment:
      PRODUTOS_URL: http://produtos:3001
      CLIENTES_URL: http://clientes:3003
      DATABASE_URL: mongodb://mongo:27017/pedidos_db
    depends_on:
      mongo:
        condition: service_started
      produtos:
        condition: service_started
      clientes:
        condition: service_started

  clientes:
    build: ./clientes
    ports:
      - "3003:3003"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/clientes_db
    depends_on:
      postgres:
        condition: service_healthy

  entregas:
    build: ./entregas
    ports:
      - "3004:3004"
    environment:
      PEDIDOS_URL: http://pedidos:3002
      DATABASE_URL: mongodb://mongo:27017/entregas_db
    depends_on:
      mongo:
        condition: service_started
      pedidos:
        condition: service_started

  gateway:
    build: ./gateway
    ports:
      - "3000:3000"
    environment:
      PRODUTOS_URL: http://produtos:3001
      PEDIDOS_URL: http://pedidos:3002
      CLIENTES_URL: http://clientes:3003
      ENTREGAS_URL: http://entregas:3004
    depends_on:
      - produtos
      - pedidos
      - clientes
      - entregas

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: produtos_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./banco/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d produtos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

volumes:
  postgres_data:
  mongo_data: